[project]
name = "rhombus-backend"
version = "0.1.0"
description = "Django API for natural-language regex matching and replacement on tabular data"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "dj-database-url>=3.1.2",
    "django>=5.2,<5.3",
    "djangorestframework>=3.17.2",
    "gunicorn>=26.2.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "regex>=2026.9.29",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
# STATIC_ROOT only exists after `collectstatic`, which runs in the Docker build.
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Migrations are generated by Django; keep them exactly as generated.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
