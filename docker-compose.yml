# Production stack: Caddy (HTTPS) -> app (gunicorn + Django + built React) -> PostgreSQL.
# Configuration comes from .env (see .env.example).

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rhombus}
      POSTGRES_USER: ${POSTGRES_USER:-rhombus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      DJANGO_DEBUG: "false"
      DATABASE_URL: postgres://${POSTGRES_USER:-rhombus}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rhombus}
      CACHE_BACKEND: database
      NUM_PROXIES: "1"
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # A domain (e.g. 3-12-45-67.sslip.io) gets an automatic Let's Encrypt certificate;
      # "http://localhost" serves plain HTTP for local testing.
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
